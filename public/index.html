<!DOCTYPE html>
<html lang="tr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-html="login.title_page">Giriş | Yükleme Yönetim Sistemi</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="Yükleme Yönetim Sistemi - Loading Management System">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yükleme">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4f46e5">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- i18n: must load before any inline script that needs translations -->
    <script src="/i18n.js"></script>

    <!-- Replaces the UI emoji with one stroked SVG icon set (this design) -->
    <script src="/icons.js" defer></script>
</head>

<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-logo">
                    <div class="login-logo-icon">🚛</div>
                    <h1 data-i18n="common.app_name">Yükleme Yönetim Sistemi</h1>
                    <p data-i18n="common.app_subtitle">Yükleme Belgesi</p>
                </div>

                <!-- Language switcher -->
                <div id="langSwitcherContainer" style="display: flex; justify-content: center; margin-bottom: 20px;"></div>

                <div class="login-error" id="loginError"></div>

                <form class="login-form" id="loginForm">
                    <div class="input-group">
                        <div class="input-icon-container">
                            <span class="icon">👤</span>
                        </div>
                        <div class="input-content">
                            <label for="username" data-i18n="login.username_label">Kullanıcı Adı</label>
                            <input type="text" id="username" name="username"
                                data-i18n-placeholder="login.username_placeholder" placeholder="Örn: ahmet"
                                autocomplete="username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-icon-container">
                            <span class="icon">🔒</span>
                        </div>
                        <div class="input-content">
                            <label for="password" data-i18n="login.password_label">Şifre</label>
                            <input type="password" id="password" name="password"
                                data-i18n-placeholder="login.password_placeholder" placeholder="••••••••"
                                autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span data-i18n="login.submit">Giriş Yap</span>
                        <span>🔐</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/check-auth');
                const data = await response.json();

                if (data.authenticated) {
                    redirectByRole(data.user.role);
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        function redirectByRole(role) {
            if (role === 'loader') {
                window.location.href = '/loader.html';
            } else if (role === 'manager') {
                window.location.href = '/manager.html';
            }
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError(window.i18n ? window.i18n.t('login.error_required') : 'Lütfen kullanıcı adı ve şifre girin');
                return;
            }

            const T = (k, f) => (window.i18n ? window.i18n.t(k, f) : f);

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<div class="spinner"></div><span>${T('login.signing_in', 'Giriş yapılıyor...')}</span>`;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    redirectByRole(data.user.role);
                } else {
                    showError(data.error || T('login.error_generic', 'Giriş yapılırken bir hata oluştu'));
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(T('login.error_connection', 'Sunucuya bağlanırken bir hata oluştu'));
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>${T('login.submit', 'Giriş Yap')}</span><span>🔐</span>`;
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Mount the language switcher and check auth
        document.addEventListener('DOMContentLoaded', () => {
            if (window.i18n) {
                window.i18n.renderSwitcher(document.getElementById('langSwitcherContainer'));
            }
        });

        // Check auth on load
        checkAuth();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('✅ ServiceWorker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.error('❌ ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
