<!DOCTYPE html>
<html lang="tr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı | Yükleme Yönetim Sistemi</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yükleme">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- i18n -->
    <script src="/theme.js"></script>
    <script src="/i18n.js"></script>

    <!-- Replaces the UI emoji with one stroked SVG icon set (steel theme only) -->
    <script src="/icons.js" defer></script>
    
    <style>
        /* The offline page is standalone (no external stylesheet, so it renders
           with no network). It carries its own copy of the two themes: the
           :root block below is the ORIGINAL design, and the steel block after
           it re-tints those same tokens when the steel theme is active. */
        :root {
            --primary: var(--brand, #4f46e5);
            --primary-dark: #4338ca;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        html[data-theme="steel"] {
            --primary: #2b3a4a;
            --primary-dark: #1a242f;
            --bg-primary: #ffffff;
            --bg-secondary: #eef0f2;
            --text-primary: #16191d;
            --text-secondary: #4b535c;
            --text-muted: #626b75;
            --border-color: #cfd4da;
            --amber-bg: #fbf1dd;
            --brand: #2b3a4a;
            --brand-2: #1a242f;
            --warn-strong: #8a5d0b;
        }

        html[data-theme="steel"] body {
            font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
            background: #eef0f2;
            background-image:
                linear-gradient(#dfe3e7 1px, transparent 1px),
                linear-gradient(90deg, #dfe3e7 1px, transparent 1px);
            background-size: 64px 64px, 64px 64px;
        }

        html[data-theme="steel"] .offline-container {
            border-radius: 2px;
            border: 1px solid #aeb6bf;
            border-top: 3px solid #e8a33d;
            box-shadow: none;
        }

        html[data-theme="steel"] .offline-icon,
        html[data-theme="steel"] .retry-btn,
        html[data-theme="steel"] .brand-icon {
            border-radius: 2px;
            background: #2b3a4a;
            background-image: none;
            box-shadow: none;
        }

        html[data-theme="steel"] .offline-icon {
            background: #e8a33d;
            color: #1a242f;
        }

        html[data-theme="steel"] .offline-hint {
            border-radius: 2px;
            border-left: 3px solid #e8a33d;
            background: #fbf1dd;
            color: #6b4a06;
        }

        html[data-theme="steel"] .offline-title,
        html[data-theme="steel"] .offline-footer-brand {
            letter-spacing: .01em;
        }

        html[data-theme="steel"] .offline-subtitle,
        html[data-theme="steel"] .offline-footer {
            color: #4b535c;
        }

        html[data-theme="steel"] .ic svg {
            width: 1em; height: 1em; stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        }

        html[data-theme="steel"] .ic {
            display: inline-flex; align-items: center; justify-content: center;
            vertical-align: -0.14em;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 480px;
            background: var(--bg-primary);
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        
        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, var(--amber-bg, #fef3c7) 0%, #fde68a 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        
        .offline-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        
        .offline-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .offline-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            background: var(--amber-bg, #fef3c7);
            border-radius: var(--r-lg, 12px);
            margin-bottom: 32px;
        }
        
        .offline-hint-icon {
            font-size: 24px;
        }
        
        .offline-hint-text {
            font-size: 14px;
            color: #92400e;
            text-align: left;
        }
        
        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--brand, #4f46e5) 0%, var(--brand-2, #7c3aed) 100%);
            color: white;
            border: none;
            border-radius: var(--r-lg, 12px);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }
        
        .retry-btn:active {
            transform: translateY(0);
        }
        
        .retry-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .retry-btn.loading .spinner {
            display: block;
        }
        
        .retry-btn.loading .btn-text {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .offline-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }
        
        .offline-footer-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--brand, #4f46e5) 0%, var(--brand-2, #7c3aed) 100%);
            border-radius: var(--r, 8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        /* Status indicator */
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warn-strong, #f59e0b);
            animation: blink 1.5s ease-in-out infinite;
        }
        
        .status-dot.online {
            background: #10b981;
            animation: none;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>

        <h1 class="offline-title" data-i18n="offline.title">Çevrimdışısınız</h1>
        <p class="offline-subtitle" data-i18n="offline.subtitle">
            İnternet bağlantınız kesilmiş görünüyor. Lütfen bağlantınızı kontrol edin ve tekrar deneyin.
        </p>

        <div class="offline-hint">
            <span class="offline-hint-icon">💡</span>
            <span class="offline-hint-text" data-i18n="offline.hint">
                Daha önce görüntülediğiniz sayfalar çevrimdışı olarak kullanılabilir olabilir.
            </span>
        </div>

        <button class="retry-btn" onclick="retryConnection()">
            <div class="spinner"></div>
            <span class="btn-text">🔄 <span data-i18n="offline.retry">Tekrar Dene</span></span>
        </button>

        <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText" data-i18n="offline.waiting">Bağlantı bekleniyor...</span>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <div id="langSwitcherContainer"></div>
        </div>

        <div class="offline-footer">
            <div class="offline-footer-brand">
                <div class="brand-icon">🚛</div>
                <span data-i18n="common.app_name">Yükleme Yönetim Sistemi</span>
            </div>
        </div>
    </div>

    <script>
        // Retry connection
        function retryConnection() {
            const btn = document.querySelector('.retry-btn');
            btn.classList.add('loading');
            
            // Try to fetch a small resource
            fetch('/api/check-auth', { method: 'GET', cache: 'no-store' })
                .then(response => {
                    if (response.ok) {
                        // Online - redirect to home
                        window.location.href = '/';
                    } else {
                        throw new Error('Still offline');
                    }
                })
                .catch(() => {
                    // Still offline
                    btn.classList.remove('loading');
                    
                    // Show a brief shake animation
                    btn.style.animation = 'shake 0.4s ease';
                    setTimeout(() => {
                        btn.style.animation = '';
                    }, 400);
                });
        }
        
        // Monitor online/offline status
        function updateOnlineStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const T = (k, f) => (window.i18n ? window.i18n.t(k, f) : f);

            if (navigator.onLine) {
                dot.classList.add('online');
                text.textContent = T('offline.detected', 'Bağlantı algılandı, yönlendiriliyor...');

                // Wait a moment then redirect
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                dot.classList.remove('online');
                text.textContent = T('offline.waiting', 'Bağlantı bekleniyor...');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Mount language switcher
        document.addEventListener('DOMContentLoaded', () => {
            if (window.i18n) {
                window.i18n.renderSwitcher(document.getElementById('langSwitcherContainer'));
            }
        });
        // Re-run online check when language changes (text needs updating)
        document.addEventListener('i18n:changed', updateOnlineStatus);

        // Initial check
        updateOnlineStatus();
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
